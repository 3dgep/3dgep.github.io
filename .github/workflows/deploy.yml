# Build the Astro + Starlight site and deploy it to GitHub Pages.
# Repository settings: Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  # Deploy when the publish branch is updated (main/draft are for writing; merge into publish to go live).
  push:
    branches: [publish]
  # Allow a manual deploy from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel a deployment that is in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # All actions run on Node 24 (Node 20 actions are deprecated on GitHub-hosted runners).
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # Node version used to build the site (Astro needs >= 22.23.4)
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site (also validates internal links)
        run: npm run build
      - uses: actions/configure-pages@v6
      # v4+ leaves out hidden files (dotfiles); the Astro build doesn't produce any.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

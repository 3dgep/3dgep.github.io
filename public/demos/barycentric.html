<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Barycentric Coordinates</title>
<style>
	:root {
		--bg: #0f1218;
		--panel: #171b24;
		--border: #2c3342;
		--text: #d6dae3;
		--muted: #8b93a5;
		--accent: #7aa2f7;
		--input: #1c2130;
		--neg: #ff7b72;
		color-scheme: dark;
	}
	:root[data-theme='light'] {
		--bg: #f7f8fa;
		--panel: #ffffff;
		--border: #d5d9e2;
		--text: #23262e;
		--muted: #5d6474;
		--accent: #2f5bd3;
		--input: #eef0f5;
		--neg: #cf222e;
		color-scheme: light;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
	#app { display: flex; flex-direction: column; height: 100%; }
	#view { position: relative; flex: 1; min-height: 0; }
	canvas { display: block; width: 100%; height: 100%; touch-action: none; }
	#bar { display: flex; align-items: flex-start; gap: 10px 14px; padding: 6px 10px; border-top: 1px solid var(--border); background: var(--panel); }
	.group { display: flex; flex-direction: column; gap: 4px; flex: none; }
	button {
		font: inherit; color: var(--text); background: var(--input); border: 1px solid var(--border);
		border-radius: 5px; padding: 2px 7px; cursor: pointer; user-select: none;
	}
	button:hover { border-color: var(--accent); }
	button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
	button[aria-pressed='true'] { border-color: var(--accent); color: var(--accent); }
	/* Always four lines high, so the drawing doesn't change size. Lines wrap between pieces, never inside one. */
	#info { flex: 1; min-width: 0; min-height: 6em; font: 12.5px/1.5 ui-monospace, Consolas, 'Cascadia Mono', monospace; }
	#info > div { display: flex; flex-wrap: wrap; column-gap: 2.2ch; align-items: center; }
	#info > div > span { white-space: pre; }
	.m { color: var(--muted); } .neg { color: var(--neg); }
	.swatch { display: inline-block; width: 2.4em; height: 1.1em; border-radius: 3px; border: 1px solid var(--border); vertical-align: middle; }
	/* A small signature at the right end of the bar: this demo was made with Claude. */
	.made-by { align-self: flex-end; flex: none; width: 18px; height: 18px; opacity: 0.35; transition: opacity 0.3s; }
	.made-by:hover { opacity: 0.9; }
</style>
</head>
<body>
<div id="app">
	<div id="view">
		<canvas id="canvas" role="img"
			aria-label="A triangle with a red, a green and a blue vertex, filled with the blend of their colors, and a point p that can be dragged, like the vertices. The point splits the triangle into three sub-triangles; the sub-triangle opposite each vertex is tinted in that vertex's color, and its area divided by the whole area is that vertex's barycentric coordinate."></canvas>
	</div>
	<div id="bar">
		<div class="group">
			<button id="gradient" type="button" aria-pressed="true">gradient</button>
			<button id="parts" type="button" aria-pressed="true">sub-triangles</button>
		</div>
		<div id="info" aria-live="polite"></div>
		<img class="made-by" src="/images/claude-logo.svg" alt="Made with Claude" title="Made with Claude" />
	</div>
</div>
<script>
'use strict';
// Coordinates are in units of a 20 x 12 field, with the y-axis pointing down, like on the screen.
const FieldW = 20, FieldH = 12;
const verts = [
	{ x: 4, y: 10, color: [255, 0, 0] },
	{ x: 10, y: 1.5, color: [0, 255, 0] },
	{ x: 17, y: 9, color: [0, 0, 255] },
];
let p = { x: 10, y: 7.5 };
let showGradient = true, showParts = true;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const info = document.getElementById('info');
let W = 1, H = 1, DPR = 1, scale = 1, ox = 0, oy = 0;

const edge = (a, b, q) => (b.x - a.x) * (q.y - a.y) - (b.y - a.y) * (q.x - a.x);
// The barycentric coordinates of q: the edge function opposite each vertex, divided by the area.
function barycentric(q) {
	const [v0, v1, v2] = verts;
	const area = edge(v0, v1, v2);
	if (area === 0) return null;
	return [edge(v1, v2, q) / area, edge(v2, v0, q) / area, edge(v0, v1, q) / area];
}
const mix = (l) => [0, 1, 2].map((c) => l[0] * verts[0].color[c] + l[1] * verts[1].color[c] + l[2] * verts[2].color[c]);

// ---- Theme (follows the embedding page) ----
let colors = {};
function currentTheme() {
	try {
		const t = window.parent !== window && window.parent.document.documentElement.dataset.theme;
		if (t === 'light' || t === 'dark') return t;
	} catch {}
	return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme() {
	document.documentElement.dataset.theme = currentTheme();
	const cs = getComputedStyle(document.documentElement);
	for (const k of ['--bg', '--text', '--muted', '--neg']) colors[k] = cs.getPropertyValue(k).trim();
	draw();
}
try {
	if (window.parent !== window) new MutationObserver(applyTheme).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
} catch {}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

function resize() {
	const r = canvas.getBoundingClientRect();
	W = Math.max(1, r.width); H = Math.max(1, r.height); DPR = window.devicePixelRatio || 1;
	canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
	scale = Math.min((W - 20) / FieldW, (H - 20) / FieldH);
	ox = (W - FieldW * scale) / 2; oy = (H - FieldH * scale) / 2;
	draw();
}
new ResizeObserver(resize).observe(canvas);
const X = (x) => ox + x * scale;
const Y = (y) => oy + y * scale;
const rgb = (c, a = 1) => `rgba(${c.map((v) => Math.round(Math.min(255, Math.max(0, v)))).join(', ')}, ${a})`;

function draw() {
	if (!colors['--bg']) return;
	ctx.setTransform(1, 0, 0, 1, 0, 0);
	ctx.fillStyle = colors['--bg'];
	ctx.fillRect(0, 0, canvas.width, canvas.height);

	// The Gouraud gradient, computed per (device) pixel of the canvas, two at a time.
	if (showGradient) {
		const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
		const step = 2;
		for (let py = 0; py < canvas.height; py += step)
			for (let px = 0; px < canvas.width; px += step) {
				const q = { x: (px / DPR - ox) / scale, y: (py / DPR - oy) / scale };
				const l = barycentric(q);
				if (!l || l[0] < 0 || l[1] < 0 || l[2] < 0) continue;
				const c = mix(l);
				for (let dy = 0; dy < step && py + dy < canvas.height; ++dy)
					for (let dx = 0; dx < step && px + dx < canvas.width; ++dx) {
						const i = ((py + dy) * canvas.width + px + dx) * 4;
						img.data[i] = c[0]; img.data[i + 1] = c[1]; img.data[i + 2] = c[2]; img.data[i + 3] = 255;
					}
			}
		ctx.putImageData(img, 0, 0);
	}
	ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

	const l = barycentric(p);
	// The three sub-triangles: p with the two vertices that are NOT vertex i, tinted in vertex i's color.
	if (showParts && l) {
		for (let i = 0; i < 3; ++i) {
			const a = verts[(i + 1) % 3], b = verts[(i + 2) % 3];
			ctx.beginPath();
			ctx.moveTo(X(p.x), Y(p.y)); ctx.lineTo(X(a.x), Y(a.y)); ctx.lineTo(X(b.x), Y(b.y)); ctx.closePath();
			ctx.fillStyle = rgb(verts[i].color, showGradient ? 0.0 : 0.35);
			ctx.fill();
			ctx.strokeStyle = l[i] < 0 ? colors['--neg'] : colors['--text'];
			ctx.lineWidth = 1.5;
			ctx.setLineDash(l[i] < 0 ? [4, 4] : []);
			ctx.stroke();
			ctx.setLineDash([]);
			// The label at the middle of the sub-triangle.
			const cx = (p.x + a.x + b.x) / 3, cy = (p.y + a.y + b.y) / 3;
			ctx.font = '700 13px ui-monospace, Consolas, monospace';
			ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
			const text = `λ${i} = ${l[i].toFixed(2)}`;
			const w = ctx.measureText(text).width + 8;
			ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
			ctx.fillRect(X(cx) - w / 2, Y(cy) - 9, w, 18);
			ctx.fillStyle = l[i] < 0 ? '#ff9b94' : rgb(verts[i].color.map((v) => Math.max(v, 110)));
			ctx.fillText(text, X(cx), Y(cy));
		}
	}

	// The triangle's outline and its vertices.
	ctx.strokeStyle = colors['--text'];
	ctx.lineWidth = 2;
	ctx.beginPath();
	verts.forEach((v, i) => (i ? ctx.lineTo(X(v.x), Y(v.y)) : ctx.moveTo(X(v.x), Y(v.y))));
	ctx.closePath(); ctx.stroke();
	verts.forEach((v, i) => {
		ctx.fillStyle = rgb(v.color);
		ctx.strokeStyle = colors['--text'];
		ctx.beginPath(); ctx.arc(X(v.x), Y(v.y), 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
		ctx.fillStyle = colors['--text'];
		ctx.font = '700 13px system-ui, sans-serif';
		ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
		ctx.fillText('v' + i, X(v.x) + 10, Y(v.y) - 6);
	});
	// The point p, filled with its interpolated color.
	ctx.fillStyle = l ? rgb(mix(l)) : colors['--muted'];
	ctx.strokeStyle = colors['--text'];
	ctx.lineWidth = 2;
	ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
	ctx.fillStyle = colors['--text'];
	ctx.fillText('p', X(p.x) + 11, Y(p.y) - 7);
	showInfo(l);
}

const line = (...pieces) => `<div>${pieces.map((x) => `<span>${x}</span>`).join('')}</div>`;
function showInfo(l) {
	if (!l) {
		info.innerHTML = line('<span class="m">the vertices are on one line: the triangle has no area</span>') + line('') + line('') + line('');
		return;
	}
	const f = (v, i) => `<span class="${v < 0 ? 'neg' : ''}">λ${i} = ${v.toFixed(3)}</span>`;
	let html = line(f(l[0], 0), f(l[1], 1), f(l[2], 2), `<span class="m">sum = ${(l[0] + l[1] + l[2]).toFixed(3)}</span>`);
	const c = mix(l).map((v) => Math.round(Math.min(255, Math.max(0, v))));
	const vc = (i) => `(${verts[i].color.join(', ')})`;
	html += line(`color = ${l[0].toFixed(2)}·${vc(0)} + ${l[1].toFixed(2)}·${vc(1)} + ${l[2].toFixed(2)}·${vc(2)}`,
		`= (${c.join(', ')}) <span class="swatch" style="background:${rgb(c)}"></span>`);
	html += line('<span class="m">λi = area of the sub-triangle opposite vi / area of the whole triangle</span>');
	const outside = l.map((v, i) => (v < 0 ? i : -1)).filter((i) => i >= 0);
	html += line(outside.length
		? `<span class="neg">p is outside: λ${outside.join(' and λ')} &lt; 0, because p crossed the edge opposite v${outside.join(' and v')}</span>`
		: '<span class="m">p is inside: all three coordinates are between 0 and 1</span>');
	info.innerHTML = html;
}

document.getElementById('gradient').addEventListener('click', (e) => {
	showGradient = !showGradient; e.currentTarget.setAttribute('aria-pressed', String(showGradient)); draw();
});
document.getElementById('parts').addEventListener('click', (e) => {
	showParts = !showParts; e.currentTarget.setAttribute('aria-pressed', String(showParts)); draw();
});

// ---- Dragging the vertices and p ----
let drag = null;
function pointAt(e) {
	const rc = canvas.getBoundingClientRect();
	return { x: (e.clientX - rc.left - ox) / scale, y: (e.clientY - rc.top - oy) / scale };
}
function handleAt(q) {
	if (Math.hypot(p.x - q.x, p.y - q.y) < 0.6) return 'p';
	const i = verts.findIndex((v) => Math.hypot(v.x - q.x, v.y - q.y) < 0.6);
	return i >= 0 ? i : null;
}
canvas.addEventListener('pointerdown', (e) => {
	drag = handleAt(pointAt(e));
	if (drag === null) return;
	canvas.setPointerCapture(e.pointerId);
	canvas.style.cursor = 'grabbing';
});
canvas.addEventListener('pointermove', (e) => {
	const q = pointAt(e);
	if (drag === null) { canvas.style.cursor = handleAt(q) !== null ? 'grab' : 'default'; return; }
	const c = { x: Math.min(FieldW, Math.max(0, q.x)), y: Math.min(FieldH, Math.max(0, q.y)) };
	if (drag === 'p') p = c; else Object.assign(verts[drag], c);
	draw();
});
const endDrag = () => { drag = null; canvas.style.cursor = 'default'; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

applyTheme();
resize();
</script>
</body>
</html>

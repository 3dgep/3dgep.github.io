<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Precision Graph</title>
<style>
	:root {
		--bg: #0f1218;
		--panel: #171b24;
		--border: #2c3342;
		--text: #d6dae3;
		--muted: #8b93a5;
		--grid: #262c39;
		--accent: #7aa2f7;
		--input: #1c2130;
		--float: #f6ad55;
		--double: #c49bff;
		color-scheme: dark;
	}
	:root[data-theme='light'] {
		--bg: #f7f8fa;
		--panel: #ffffff;
		--border: #d5d9e2;
		--text: #23262e;
		--muted: #5d6474;
		--grid: #e3e6ec;
		--accent: #2f5bd3;
		--input: #eef0f5;
		--float: #b55f00;
		--double: #7b3fc9;
		color-scheme: light;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
	#app { display: flex; flex-direction: column; height: 100%; }
	#view { position: relative; flex: 1; min-height: 0; }
	canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; outline: none; }
	canvas.dragging { cursor: grabbing; }
	#bar {
		display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
		padding: 6px 8px; border-top: 1px solid var(--border); background: var(--panel);
	}
	.group { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
	.break { flex-basis: 100%; height: 0; } /* one row each: the constants, the places, and zoom and range */
	.group > span { color: var(--muted); margin-right: 2px; }
	button {
		font: inherit; color: var(--text); background: var(--input); border: 1px solid var(--border);
		border-radius: 5px; padding: 3px 8px; cursor: pointer; touch-action: none; user-select: none;
	}
	button:hover { border-color: var(--accent); }
	button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
	button.zoom { width: 30px; padding: 3px 0; font-weight: 700; }
	button[aria-pressed='true'] { border-color: var(--accent); color: var(--accent); }
	/* A small signature at the right end of the bar: this demo was made with Claude. */
	.made-by { margin-left: auto; flex: none; width: 18px; height: 18px; opacity: 0.35; transition: opacity 0.3s; }
	.made-by:hover { opacity: 0.9; }
	/* Fullscreen button: top right, faint, hidden while the mouse doesn't move. */
	#fullscreen {
		position: absolute; top: 8px; right: 8px; z-index: 1;
		width: 34px; height: 34px; padding: 6px; border-radius: 6px;
		background: var(--panel); color: var(--text); opacity: 0.45; transition: opacity 0.3s;
	}
	#fullscreen:hover, #fullscreen:focus-visible { opacity: 0.95; }
	#fullscreen.idle:not(:hover):not(:focus-visible) { opacity: 0; pointer-events: none; }
	#fullscreen svg { display: block; width: 100%; height: 100%; }
	#fullscreen .exit, :fullscreen #fullscreen .enter { display: none; }
	:fullscreen #fullscreen .exit { display: block; }
</style>
</head>
<body>
<div id="app">
	<div id="view">
		<canvas id="canvas" tabindex="0" role="img"
			aria-label="A log-log graph of the gap between two neighbouring values against the value, for float and double"></canvas>
		<button id="fullscreen" type="button" title="Fullscreen (F11)" aria-label="Toggle fullscreen" hidden>
			<svg class="enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
				<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>
			</svg>
			<svg class="exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
				<path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/>
			</svg>
		</button>
	</div>
	<div id="bar">
		<div class="group" id="constants">
			<span>Go to:</span>
		</div>
		<div class="break"></div>
		<div class="group" id="places">
			<span>Places:</span>
		</div>
		<div class="break"></div>
		<div class="group">
			<button class="zoom" id="zoomOut" title="Zoom out (-)" aria-label="Zoom out">−</button>
			<button class="zoom" id="zoomIn" title="Zoom in (+)" aria-label="Zoom in">+</button>
		</div>
		<div class="group" id="views">
			<span>Range of:</span>
		</div>
		<div class="group" id="scale" role="group" aria-label="Scale">
			<span>Scale:</span>
			<button id="scaleLog" type="button" aria-pressed="true" title="Both axes logarithmic: every power of two is the same distance">logarithmic</button>
			<button id="scaleLin" type="button" aria-pressed="false" title="Both axes linear: the real sizes of the steps">linear</button>
		</div>
		<img class="made-by" src="/images/claude-logo.svg" alt="Made with Claude" title="Made with Claude" />
	</div>
</div>
<script>
'use strict';

// ---- The types -------------------------------------------------------------------------------------------------
// Everything is in log2 units: lx = log2 of the size of a number, ly = log2 of the gap between two neighbouring values.
// A float with exponent e (the range from 2^e to 2^(e+1)) has 2^mant values in that range: the gap is 2^(e - mant).
// Below the smallest normal exponent (subnormal numbers) the gap stays 2^(minE - mant).
const FLOATS = [
	{ name: 'float', mant: 23, minE: -126, maxE: 127, max: 'FLT_MAX', color: '--float' },
	{ name: 'double', mant: 52, minE: -1022, maxE: 1023, max: 'DBL_MAX', color: '--double' },
];
for (const t of FLOATS) { t.from = t.minE - t.mant; t.to = t.maxE + 1; } // smallest value 2^from, largest just below 2^to
const gapExp = (t, e) => Math.max(e, t.minE) - t.mant;
const LOG2_10 = Math.log2(10), LOG10_2 = Math.log10(2);

// ---- Formatting ------------------------------------------------------------------------------------------------
const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
const sup = (n) => String(n).split('').map((c) => SUP[c]).join('');
const commas = (s) => s.replace(/^(\d+)/, (i) => i.replace(/\B(?=(\d{3})+(?!\d))/g, ','));
// 2^l as text, with 3 significant digits (also far outside the range of a double).
function fmtPow2(l) {
	const e10 = l * LOG10_2;
	let n = Math.floor(e10 + 1e-9), m = Math.pow(10, e10 - n);
	if (m >= 9.995) { m /= 10; n++; }
	if (n >= -4 && n <= 15) {
		const v = m * Math.pow(10, n);
		return commas(n >= 2 ? String(Math.round(v)) : v.toPrecision(3).replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, ''));
	}
	return `${m.toFixed(2)} × 10${sup(n)}`;
}
// A gap of exactly 2^k.
function fmtGap(k) {
	if (k >= 0 && k <= 53) return k === 0 ? '1' : `2${sup(k)} = ${commas(String(Math.pow(2, k)))}`;
	if (k < 0 && k >= -8) return `2${sup(k)} = ${Math.pow(2, k)}`;
	return `2${sup(k)} ≈ ${fmtPow2(k)}`;
}
// A tick label for 10^n.
function fmtDecade(n) {
	if (n >= 0 && n <= 6) return commas('1' + '0'.repeat(n));
	if (n < 0 && n >= -3) return '0.' + '0'.repeat(-n - 1) + '1';
	return `10${sup(n)}`;
}

// The points on the lines: { text, type, lx (log2 of the size), ly (log2 of the gap) }. Labels that would overlap are
// left out, in order: the constants of <cfloat> first, then the places from the number line (on both lines).
const [FLT, DBL] = FLOATS;
const MARKS = [];
for (const [t, p] of [[FLT, 'FLT'], [DBL, 'DBL']]) {
	MARKS.push(
		{ text: `${p}_EPSILON = 2${sup(-t.mant)}: the gap at 1`, t, constant: true, lx: 0, ly: -t.mant },
		{ text: `${p}_MIN = 2${sup(t.minE)} ≈ ${fmtPow2(t.minE)}`, t, constant: true, lx: t.minE, ly: gapExp(t, t.minE) },
		{ text: `${p}_TRUE_MIN = 2${sup(t.from)} ≈ ${fmtPow2(t.from)}`, t, constant: true, lx: t.from, ly: gapExp(t, t.from) },
		{ text: `${p}_MAX ≈ ${fmtPow2(t.to)}, then ∞`, t, constant: true, lx: t.to, ly: gapExp(t, t.to - 1) },
	);
}
for (const [label, v] of [['0.1', 0.1], ['2²⁴', 16777216], ['Earth', 6371000], ['1 day in ms', 86400000],
	['Sun', 695700000], ['Neptune', 4.4984e12]]) { // radii in metres (Neptune: the radius of its orbit)
	const lx = Math.log2(v);
	for (const t of [FLT, DBL]) {
		const ly = gapExp(t, Math.floor(lx));
		MARKS.push({ text: `${label}: ${fmtGap(ly).replace(/^2\S* [=≈] /, '')}`, t, lx, ly });
	}
}

// ---- View --------------------------------------------------------------------------------------------------------
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const FONT = 'system-ui, -apple-system, "Segoe UI", sans-serif';
const MONO = 'menlo, consolas, "DejaVu Sans Mono", monospace';
let W = 800, H = 400, DPR = 1;
const M = { l: 58, r: 10, t: 10, b: 34 }; // the plot area's margins (room for the axis labels; on a linear scale, the
// left one is wider: see setScale)
const pw = () => W - M.l - M.r, ph = () => H - M.t - M.b;
// The view, in view units: log2 of the values (logarithmic scale), or the values themselves (linear scale). cx and cy
// are the view units in the middle of the plot area; zx and zy the zoom, as log2 of the pixels per view unit. (On a
// linear scale near DBL_MIN, the pixels per unit don't fit in a double, so the zoom is applied in two halves.)
let linear = false;
let cx = 20, cy = -17, zx = 3, zy = 2;
const MAXV = Number.MAX_VALUE;
const val = (l) => (l >= 1024 ? MAXV : Math.pow(2, l)); // 2^l (DBL_MAX for the end of the double line)
const U = (l) => (linear ? val(l) : l); // log2 units to view units
const scaleBy = (d, z) => d * Math.pow(2, z / 2) * Math.pow(2, z - z / 2);
const unscale = (p, z) => p * Math.pow(2, -z / 2) * Math.pow(2, -(z - z / 2));
const Xu = (u) => M.l + pw() / 2 + scaleBy(u - cx, zx);
const Yu = (u) => M.t + ph() / 2 - scaleBy(u - cy, zy);
const X = (lx) => Xu(U(lx));
const Y = (ly) => Yu(U(ly));
const LX = (x) => cx + unscale(x - M.l - pw() / 2, zx); // view units at x
const LY = (y) => cy - unscale(y - M.t - ph() / 2, zy);
// A view given as the log2 ranges to show.
const VIEWS = [
	['Everyday numbers', [-35, 75], [-75, 40]],
	['float', [-170, 150], [-185, 120]],
	['double', [-1140, 1130], [-1480, 1180]],
];
const viewOf = ([, [x0, x1], [y0, y1]]) => ({ cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, zx: Math.log2(pw() / (x1 - x0)), zy: Math.log2(ph() / (y1 - y0)) });
// A linear view from (a little left of) 0 to xTop, and from 0 to yTop. (Computed without xTop - x0: that can overflow.)
// (Below 0, a little more room: for the title of the x axis.)
const linViewOf = (xTop, yTop) => ({ cx: xTop * 0.485, cy: yTop * 0.45, zx: Math.log2(pw()) - Math.log2(xTop) - Math.log2(1.03), zy: Math.log2(ph()) - Math.log2(yTop) - Math.log2(1.1) });
function clampView() {
	if (!linear) {
		zx = Math.max(Math.log2(pw() / 2600), Math.min(Math.log2(pw() / 3), zx));
		zy = Math.max(Math.log2(ph() / 2600), Math.min(Math.log2(ph() / 3), zy));
		cx = Math.max(-1200, Math.min(1150, cx));
		cy = Math.max(-1250, Math.min(1100, cy));
		return;
	}
	// Linear: from 16 times the smallest double up to all of them across; never more than 15% left of (or below) 0.
	const lim = (z, px) => Math.max(Math.log2(px) - 1024.05, Math.min(Math.log2(px) + 1070, z));
	zx = lim(zx, pw()); zy = lim(zy, ph());
	const half = (z, px) => unscale(px / 2, z);
	cx = Math.min(MAXV, Math.max(half(zx, pw()) * 0.7, cx));
	cy = Math.min(MAXV, Math.max(half(zy, ph()) * 0.7, cy));
}
let pending = false;
function requestDraw() { if (!pending) { pending = true; requestAnimationFrame(draw); } }
let first = true;
function resize() {
	const r = canvas.getBoundingClientRect();
	const oldW = pw(), oldH = ph();
	W = Math.max(1, r.width); H = Math.max(1, r.height); DPR = window.devicePixelRatio || 1;
	canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
	ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
	if (first) { ({ cx, cy, zx, zy } = viewOf(VIEWS[0])); first = false; }
	else { zx += Math.log2(pw() / oldW); zy += Math.log2(ph() / oldH); } // keep the same part of the graph in view
	clampView(); requestDraw();
}
new ResizeObserver(resize).observe(canvas);

// ---- Theme (follows the embedding page) -------------------------------------------------------------------------
let colors = {};
function currentTheme() {
	try {
		const t = window.parent !== window && window.parent.document.documentElement.dataset.theme;
		if (t === 'light' || t === 'dark') return t;
	} catch {}
	return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme() {
	document.documentElement.dataset.theme = currentTheme();
	const cs = getComputedStyle(document.documentElement);
	for (const k of ['--bg', '--panel', '--text', '--muted', '--grid', '--accent', '--border', '--float', '--double'])
		colors[k] = cs.getPropertyValue(k).trim();
	requestDraw();
}
try {
	if (window.parent !== window) new MutationObserver(applyTheme).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
} catch {}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

// ---- Drawing -----------------------------------------------------------------------------------------------------
let mouse = null; // the pointer position over the plot, or null
const Y_TITLE = '↑ gap to the next value (lower is more precise)';
const snap = (v) => (Math.round(v * DPR) + 0.5) / DPR;
// The step between two ticks, in decades: at least minPx pixels apart.
function decadeStep(pxPerLog2, minPx) {
	const per = pxPerLog2 * LOG2_10;
	for (const d of [1, 2, 5, 10, 20, 50, 100, 200, 500]) if (d * per >= minPx) return d;
	return 1000;
}
// The baseline that centres digits vertically on y, in the current font. (textBaseline 'middle' centres the font's em box,
// and the digits are higher than that: they would sit almost a pixel too high in a label.)
function digitsBaseline(y) {
	const m = ctx.measureText('0');
	return y + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
}
function pill(text, x, y, color, align) {
	ctx.font = `600 11px ${MONO}`;
	const w = ctx.measureText(text).width + 10;
	const left = align === 'right' ? x - w : x;
	ctx.fillStyle = colors['--panel']; ctx.strokeStyle = color; ctx.lineWidth = 1;
	ctx.beginPath(); ctx.roundRect(left, y - 9, w, 18, 4); ctx.fill(); ctx.stroke();
	ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
	ctx.fillText(text, left + 5, digitsBaseline(y));
	return { x: left, y: y - 9, w, h: 18 };
}
// Linear ticks: f (1, 2 or 5) times 10^p, at least minPx pixels apart. (Kept as f and p: near the smallest doubles,
// 10^p itself isn't exact, or even 0.)
function niceStep(z, minPx) {
	const l = Math.log10(unscale(minPx, z)), p = Math.floor(l), r = Math.pow(10, l - p);
	return r <= 1 ? { f: 1, p } : r <= 2 ? { f: 2, p } : r <= 5 ? { f: 5, p } : { f: 1, p: p + 1 };
}
// The ticks k * f * 10^p from lo to hi, at or above 0, with labels in one format for the whole axis: plain numbers, or
// all with the same power of ten (0.5, 1.0, 1.5 × 10⁻⁷). [view units, label, is it 0?]
function linearTicks(z, minPx, lo, hi) {
	const { f, p } = niceStep(z, minPx), st = f * Math.pow(10, p);
	const k0 = Math.max(0, Math.ceil(lo / st)), k1 = Math.floor(hi / st);
	if (!(st > 0) || !Number.isFinite(k0) || !Number.isFinite(k1) || k1 - k0 > 100) return []; // (never loop forever)
	const E = p + Math.floor(Math.log10(Math.max(1, k1) * f) + 1e-9); // the power of ten of the largest tick
	const plain = E < 7 && p >= -4;
	const out = [];
	for (let i = 0; i <= k1 - k0; i++) { // (counted with an index: above 2^53, k + 1 can be equal to k)
		const k = k0 + i, m = k * f; // the tick is m * 10^p
		let label;
		if (k === 0) label = '0';
		else if (plain) label = commas((m * Math.pow(10, p)).toFixed(Math.max(0, -p)));
		else label = `${(m * Math.pow(10, p - E)).toFixed(Math.min(20, E - p))} × 10${sup(E)}`; // (at most 20 decimals: far from 0)
		out.push([k * st, label, k === 0]);
	}
	return out;
}
const overlaps = (a, list) => list.some((b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h);

function draw() {
	pending = false;
	const c = colors;
	ctx.fillStyle = c['--bg']; ctx.fillRect(0, 0, W, H);
	const x0 = M.l, x1 = W - M.r, y0 = M.t, y1 = H - M.b;
	// The view, in view units. (Linear: at the largest double, the right edge can be beyond it, which would be +Infinity:
	// that hid the double line.)
	const cap = (u) => (linear ? Math.min(MAXV, u) : u);
	const uxMin = LX(x0), uxMax = cap(LX(x1)), uyMin = LY(y1), uyMax = cap(LY(y0));
	// The same in log2 units (on a linear scale: the largest value in view, and 70 powers of two below it; the steps
	// below those are all squeezed against 0).
	const lxMax = linear ? Math.log2(Math.max(uxMax, 0)) : uxMax;
	const lxMin = linear ? (uxMin > 0 ? Math.log2(uxMin) : lxMax - 70) : uxMin;

	// Grid and axis labels: at powers of ten (logarithmic), or at round numbers (linear).
	ctx.font = `11px ${FONT}`; ctx.lineWidth = 1;
	const ticksX = [], ticksY = [];
	if (!linear) {
		const dx = decadeStep(Math.pow(2, zx), 64), dy = decadeStep(Math.pow(2, zy), 26);
		for (let n = Math.ceil(uxMin * LOG10_2 / dx) * dx; n <= uxMax * LOG10_2; n += dx) ticksX.push([n * LOG2_10, fmtDecade(n), n === 0]);
		for (let n = Math.ceil(uyMin * LOG10_2 / dy) * dy; n <= uyMax * LOG10_2; n += dy) ticksY.push([n * LOG2_10, fmtDecade(n), n === 0]);
	} else {
		ticksX.push(...linearTicks(zx, 90, uxMin, uxMax));
		ticksY.push(...linearTicks(zy, 30, uyMin, uyMax));
	}
	ctx.textAlign = 'center'; ctx.textBaseline = 'top';
	for (const [u, label, axis] of ticksX) {
		const x = snap(Xu(u));
		ctx.strokeStyle = axis ? c['--border'] : c['--grid'];
		ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1 + 4); ctx.stroke();
		if (x + ctx.measureText(label).width / 2 > W - 2) continue; // (doesn't fit)
		ctx.fillStyle = c['--muted']; ctx.fillText(label, x, y1 + 6);
	}
	ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
	for (const [u, label, axis] of ticksY) {
		const y = snap(Yu(u));
		ctx.strokeStyle = axis ? c['--border'] : c['--grid'];
		ctx.beginPath(); ctx.moveTo(x0 - 4, y); ctx.lineTo(x1, y); ctx.stroke();
		ctx.fillStyle = c['--muted']; ctx.fillText(label, x0 - 7, y);
	}
	// Axis titles.
	ctx.fillStyle = c['--muted']; ctx.font = `italic 11px ${FONT}`;
	ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
	ctx.fillText('value (negative values have the same gaps) →', x1, y1 - 3);
	ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
	ctx.fillText(Y_TITLE, x0 + 8, y0 + 34);

	ctx.save();
	ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip();
	ctx.lineJoin = 'round'; ctx.lineCap = 'round';

	// float and double: a staircase, one step at every power of two. (Linear: starting at 0, where the steps below the
	// ones in view are all squeezed together.)
	for (const t of FLOATS) {
		if (!(lxMax > -Infinity)) continue; // linear, and nothing above 0 in view
		const a = Math.max(t.from, Math.floor(lxMin) - 1), b = Math.min(t.to, Math.ceil(lxMax) + 1);
		if (a >= b) continue;
		ctx.strokeStyle = c[t.color]; ctx.lineWidth = 2.5;
		ctx.beginPath();
		for (let e = a; e < b; e++) {
			const y = Y(gapExp(t, e));
			if (e === a) ctx.moveTo(linear ? Xu(0) : X(e), y);
			ctx.lineTo(X(e), y);
			ctx.lineTo(X(e + 1), y);
		}
		ctx.stroke();
	}

	// The points, each with a label (see options below). The dots are drawn first, so that the labels go over them.
	// (Linear: not the points that are squeezed against 0, a few pixels from it.)
	const visible = MARKS.filter((m) => {
		const x = X(m.lx), y = Y(m.ly);
		if (linear && x - Xu(0) < 4 && Yu(0) - y < 4) return false;
		return x >= x0 - 6 && x <= x1 + 6 && y >= y0 - 6 && y <= y1 + 6;
	});
	for (const m of visible) {
		ctx.fillStyle = c[m.t.color]; ctx.strokeStyle = c['--bg']; ctx.lineWidth = 2;
		ctx.beginPath(); ctx.arc(X(m.lx), Y(m.ly), 4.5, 0, 7); ctx.fill(); ctx.stroke();
	}
	// Keep the labels off the legend and the fullscreen button. A point right next to one that has a label gets none
	// (unless it's a constant). The labels are placed in order along each line, so that the label of a smaller value is
	// always below the labels of larger values, and no line to a label crosses another label: float labels (above-left
	// of their points) from small to large, double labels (below-right) from large to small. When the whole double
	// range is in view, the doubles go first.
	ctx.font = `italic 11px ${FONT}`;
	const titleW = ctx.measureText(Y_TITLE).width;
	const taken = [{ x: x0, y: y0, w: 150, h: 24 }, { x: x0, y: y0 + 24, w: titleW + 12, h: 18 }, { x: W - 50, y: 0, w: 50, h: 50 }];
	const wide = !linear && uxMax - uxMin > 400;
	// The constants first (they matter most), then the places, which only get a label where it fits between them.
	const along = (t, c) => visible.filter((m) => m.t === t && !m.constant === !c).sort((a, b) => (t === FLT ? a.lx - b.lx : b.lx - a.lx));
	const lines = wide ? [DBL, FLT] : [FLT, DBL];
	const order = [...lines.flatMap((t) => along(t, true)), ...lines.flatMap((t) => along(t, false))];
	const labelled = [], placed = [];
	for (const m of visible) taken.push({ x: X(m.lx) - 6, y: Y(m.ly) - 6, w: 12, h: 12 }); // no label over a dot
	// On each line, the label of a larger value is always higher than the label of a smaller value.
	const inOrder = (m, ay) => placed.every((p) => p.m.t !== m.t || (p.m.lx < m.lx ? ay <= p.ay - 18 : p.m.lx > m.lx ? ay >= p.ay + 18 : true));
	ctx.font = `600 11px ${MONO}`;
	for (const m of order) {
		const x = X(m.lx), y = Y(m.ly), col = c[m.t.color];
		if (!m.constant && labelled.some((p) => Math.hypot(p.x - x, p.y - y) < 14)) continue;
		const w = ctx.measureText(m.text).width + 10;
		// [left or right, above or below, distance]: float labels above the line (above-left is the empty side of the
		// staircase), double labels below it (below-right), also a bit further out; the other side only for the constants
		// of <cfloat>, when there's no room at all (a place on the line then has no label).
		const side = m.t === FLT ? -1 : 1;
		// (Below-left or above-right of a point would cross the line, which rises to the right.)
		const options = [22, 44, 66, 88, 110].map((d) => [side, side, d]);
		if (m.constant) options.push([-side, side, 22], [-side, side, 44], [side, -side, 22], [-side, -side, 22]);
		for (const [h, v, d] of options) {
			const ax = x + h * 8, ay = y + v * d;
			const box = { x: h < 0 ? ax - w : ax, y: ay - 9, w, h: 18 };
			if (box.x < x0 || box.x + box.w > x1 || box.y < y0 || box.y + box.h > y1 || overlaps(box, taken)) continue;
			if (!inOrder(m, ay)) continue;
			taken.push(box); labelled.push({ x, y });
			placed.push({ m, col, from: [x + h * 3, y + v * 3], ax, ay, align: h < 0 ? 'right' : 'left' });
			break;
		}
	}
	// The lines to the labels first, then the labels on top of them.
	for (const p of placed) {
		ctx.strokeStyle = p.col; ctx.lineWidth = 1;
		ctx.beginPath(); ctx.moveTo(...p.from); ctx.lineTo(p.ax, p.ay + (p.ay > p.from[1] ? -9 : 9)); ctx.stroke();
	}
	for (const p of placed) pill(p.m.text, p.ax, p.ay, p.col, p.align);
	ctx.restore();

	// Legend.
	const legend = [['float', '--float'], ['double', '--double']];
	ctx.font = `600 12px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
	let lxp = x0 + 8;
	for (const [name, k] of legend) {
		ctx.strokeStyle = c[k]; ctx.lineWidth = 2.5;
		ctx.beginPath(); ctx.moveTo(lxp, y0 + 14); ctx.lineTo(lxp + 16, y0 + 14); ctx.stroke();
		ctx.fillStyle = c[k]; ctx.fillText(name, lxp + 21, y0 + 14);
		lxp += 21 + ctx.measureText(name).width + 16;
	}

	// The cursor: the gap of each type at the size under the pointer.
	if (mouse && mouse.x >= x0 && mouse.x <= x1 && mouse.y >= y0 && mouse.y <= y1) {
		const lx = linear ? Math.log2(LX(mouse.x)) : LX(mouse.x), e = Math.floor(lx); // (linear, at or left of 0: -Infinity or NaN)
		const xs = snap(mouse.x);
		ctx.strokeStyle = c['--muted']; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
		ctx.beginPath(); ctx.moveTo(xs, y0); ctx.lineTo(xs, y1); ctx.stroke(); ctx.setLineDash([]);
		const lines = [[`value: ${lx > -Infinity ? fmtPow2(lx) : '0'}`, c['--text']]];
		for (const t of FLOATS) {
			if (!(lx > -Infinity)) lines.push([`${t.name}: gap ${fmtGap(t.from)} (the smallest)`, c[t.color]]);
			else if (lx < t.from) lines.push([`${t.name}: too small, becomes 0`, c[t.color]]);
			else if (lx >= t.to) lines.push([`${t.name}: too large, becomes ∞`, c[t.color]]);
			else {
				const k = gapExp(t, e);
				lines.push([`${t.name}: gap ${fmtGap(k)}${e < t.minE ? ' (subnormal)' : ''}`, c[t.color]]);
				const y = Y(k);
				if (y >= y0 && y <= y1) { ctx.fillStyle = c[t.color]; ctx.beginPath(); ctx.arc(mouse.x, y, 4, 0, 7); ctx.fill(); }
			}
		}
		// The box next to the pointer (on the other side when it doesn't fit).
		ctx.font = `600 11px ${MONO}`;
		const w = Math.max(...lines.map(([s]) => ctx.measureText(s).width)) + 16, h = lines.length * 17 + 10;
		let bx = mouse.x + 14, by = mouse.y + 14;
		if (bx + w > x1) bx = mouse.x - 14 - w;
		if (by + h > y1) by = Math.max(y0, mouse.y - 14 - h);
		ctx.fillStyle = c['--panel']; ctx.strokeStyle = c['--border']; ctx.lineWidth = 1;
		ctx.beginPath(); ctx.roundRect(bx, by, w, h, 5); ctx.fill(); ctx.stroke();
		ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
		lines.forEach(([s, col], i) => { ctx.fillStyle = col; ctx.fillText(s, bx + 8, digitsBaseline(by + 13.5 + i * 17)); });
	}
}

// ---- Interaction -------------------------------------------------------------------------------------------------
let anim = null;
const stopAnim = () => { anim = null; };
function zoomAt(px, py, f) {
	const ux = LX(px), uy = LY(py);
	zx += Math.log2(f); zy += Math.log2(f); clampView();
	cx += ux - LX(px); cy += uy - LY(py); clampView();
	requestDraw();
}
canvas.addEventListener('wheel', (e) => {
	e.preventDefault(); stopAnim();
	const r = canvas.getBoundingClientRect();
	zoomAt(e.clientX - r.left, e.clientY - r.top, Math.pow(2, -e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0015)));
}, { passive: false });
const pointers = new Map();
let pinch = null;
canvas.addEventListener('pointerdown', (e) => {
	stopAnim(); canvas.setPointerCapture(e.pointerId); canvas.focus();
	pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
	if (pointers.size === 2) {
		const [a, b] = [...pointers.values()];
		pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) };
	}
	canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove', (e) => {
	const p = pointers.get(e.pointerId);
	if (p) {
		if (pointers.size === 1) { cx -= unscale(e.offsetX - p.x, zx); cy += unscale(e.offsetY - p.y, zy); clampView(); }
		p.x = e.offsetX; p.y = e.offsetY;
		if (pointers.size === 2 && pinch) {
			const [a, b] = [...pointers.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
			if (pinch.d > 0) zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, d / pinch.d);
			pinch.d = d;
		}
	}
	mouse = e.pointerType === 'mouse' || pointers.size === 1 ? { x: e.offsetX, y: e.offsetY } : null;
	requestDraw();
});
const up = (e) => {
	pointers.delete(e.pointerId);
	if (pointers.size < 2) pinch = null;
	if (!pointers.size) canvas.classList.remove('dragging');
};
canvas.addEventListener('pointerup', up);
canvas.addEventListener('pointercancel', up);
canvas.addEventListener('pointerleave', () => { if (!pointers.size) { mouse = null; requestDraw(); } });
canvas.addEventListener('keydown', (e) => {
	const step = 40;
	if (e.key === '+' || e.key === '=') zoomAt(M.l + pw() / 2, M.t + ph() / 2, 1.5);
	else if (e.key === '-') zoomAt(M.l + pw() / 2, M.t + ph() / 2, 1 / 1.5);
	else if (e.key === 'ArrowLeft') cx -= unscale(step, zx);
	else if (e.key === 'ArrowRight') cx += unscale(step, zx);
	else if (e.key === 'ArrowUp') cy += unscale(step, zy);
	else if (e.key === 'ArrowDown') cy -= unscale(step, zy);
	else return;
	e.preventDefault(); stopAnim(); clampView(); requestDraw();
});
document.getElementById('zoomIn').addEventListener('click', () => { stopAnim(); zoomAt(M.l + pw() / 2, M.t + ph() / 2, 1.5); });
document.getElementById('zoomOut').addEventListener('click', () => { stopAnim(); zoomAt(M.l + pw() / 2, M.t + ph() / 2, 1 / 1.5); });

// Move to a view, zooming on a log scale. The start time is the first frame's timestamp (the requestAnimationFrame
// clock can differ from performance.now() in an iframe that loaded lazily).
function flyTo(v) {
	const a = { cx, cy, zx, zy }, b = v;
	let t0 = null;
	const me = {}; anim = me;
	const step = (now) => {
		if (anim !== me) return;
		if (t0 === null) t0 = now;
		const t = Math.min(1, (now - t0) / 900), k = t * t * (3 - 2 * t);
		cx = a.cx + (b.cx - a.cx) * k; cy = a.cy + (b.cy - a.cy) * k;
		zx = a.zx + (b.zx - a.zx) * k; zy = a.zy + (b.zy - a.zy) * k;
		clampView(); requestDraw();
		if (t < 1) requestAnimationFrame(step); else anim = null;
	};
	requestAnimationFrame(step);
}
// Go to a point on a line, zoomed in so that the steps of the staircase are visible (about 30 powers of two; a place
// 16, so that the places close to it are far enough apart for their labels). On a linear scale: from 0 to 2.5 times
// the value, which shows the last steps before it (each twice as high as the one before):
// [button, the start of the point's label, row].
const GOTO = [
	['FLT_MIN', 'FLT_MIN', 'constants'], ['FLT_EPSILON', 'FLT_EPSILON', 'constants'], ['FLT_MAX', 'FLT_MAX', 'constants'],
	['DBL_MIN', 'DBL_MIN', 'constants'], ['DBL_EPSILON', 'DBL_EPSILON', 'constants'], ['DBL_MAX', 'DBL_MAX', 'constants'],
	['0.1', '0.1:', 'places'], ['2²⁴', '2²⁴:', 'places'], ['Earth', 'Earth:', 'places'], ['1 day in ms', '1 day in ms', 'places'],
	['Sun', 'Sun:', 'places'], ['Neptune', 'Neptune:', 'places'],
];
for (const [label, prefix, row] of GOTO) {
	const marks = MARKS.filter((k) => k.text.startsWith(prefix));
	const b = document.createElement('button');
	b.textContent = label;
	// A place is on both lines (29 powers of two apart): the view shows both, so it's a bit taller.
	const lys = marks.map((m) => m.ly), lo = Math.min(...lys), hi = Math.max(...lys);
	const across = row === 'places' ? 16 : 30, m = marks[0];
	b.addEventListener('click', () => {
		if (!linear) return flyTo({ cx: m.lx, cy: (lo + hi) / 2, zx: Math.log2(pw() / across), zy: Math.log2(ph() / (hi - lo + 44)) });
		const xTop = Math.min(MAXV, 2.5 * val(m.lx));
		flyTo(linViewOf(xTop, 1.15 * val(gapExp(m.t, Math.min(m.t.to - 1, Math.floor(Math.log2(xTop)))))));
	});
	document.getElementById(row).appendChild(b);
}
for (const view of VIEWS.slice(1)) { // the first view is the one at the start
	const b = document.createElement('button');
	b.textContent = view[0];
	const t = view[0] === 'float' ? FLT : DBL;
	b.addEventListener('click', () => flyTo(linear ? linViewOf(Math.min(MAXV, 1.05 * val(t.to)), 1.1 * val(gapExp(t, t.to - 1))) : viewOf(view)));
	document.getElementById('views').appendChild(b);
}

// The scale: logarithmic or linear. Switching to linear shows the values from 0 to 2.5 times the value in the middle
// of the view (on the float line, or on the double line beyond the floats); switching back returns to the last
// logarithmic view.
let lastLog = null;
function setScale(lin) {
	if (lin === linear) return;
	stopAnim();
	M.l = lin ? 76 : 58; // (room for labels like 2.5 × 10⁻⁴⁵; the log view is restored with the same margin it had)
	if (lin) {
		lastLog = { cx, cy, zx, zy };
		const t = cx < FLT.to ? FLT : DBL, lx = Math.max(t.from + 2, Math.min(t.to - 1, cx));
		const xTop = Math.min(MAXV, 2.5 * val(lx));
		linear = true;
		({ cx, cy, zx, zy } = linViewOf(xTop, 1.15 * val(gapExp(t, Math.min(t.to - 1, Math.floor(Math.log2(xTop)))))));
	} else {
		linear = false;
		({ cx, cy, zx, zy } = lastLog || viewOf(VIEWS[0]));
	}
	clampView(); requestDraw();
	document.getElementById('scaleLog').setAttribute('aria-pressed', String(!lin));
	document.getElementById('scaleLin').setAttribute('aria-pressed', String(lin));
}
document.getElementById('scaleLog').addEventListener('click', () => setScale(false));
document.getElementById('scaleLin').addEventListener('click', () => setScale(true));

// Fullscreen: the button, or F11.
(function () {
	const button = document.getElementById('fullscreen');
	if (!document.fullscreenEnabled) return;
	button.hidden = false;
	const toggle = () => {
		if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
		else document.documentElement.requestFullscreen().catch(() => {});
	};
	button.addEventListener('click', () => { toggle(); button.blur(); canvas.focus(); });
	document.addEventListener('keydown', (e) => { if (e.key === 'F11') { e.preventDefault(); toggle(); } });
	let timer = 0;
	const show = () => {
		button.classList.remove('idle');
		clearTimeout(timer);
		timer = setTimeout(() => button.classList.add('idle'), 2500);
	};
	window.addEventListener('pointermove', show);
	window.addEventListener('pointerdown', show);
	show();
})();

applyTheme();
resize();
</script>
</body>

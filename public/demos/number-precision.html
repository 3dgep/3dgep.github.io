<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Number Precision</title>
<style>
	:root {
		--bg: #0f1218;
		--panel: #171b24;
		--border: #2c3342;
		--text: #d6dae3;
		--muted: #8b93a5;
		--grid: #262c39;
		--accent: #7aa2f7;
		--input: #1c2130;
		--int: #7aa2f7;
		--uint: #4fd1c5;
		--float: #f6ad55;
		--double: #c49bff;
		--mono: menlo, consolas, 'DejaVu Sans Mono', monospace;
		color-scheme: dark;
	}
	:root[data-theme='light'] {
		--bg: #f7f8fa;
		--panel: #ffffff;
		--border: #d5d9e2;
		--text: #23262e;
		--muted: #5d6474;
		--grid: #e3e6ec;
		--accent: #2f5bd3;
		--input: #eef0f5;
		--int: #2f5bd3;
		--uint: #0b7f74;
		--float: #b55f00;
		--double: #7b3fc9;
		color-scheme: light;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
	#app { display: flex; flex-direction: column; height: 100%; }
	#view { position: relative; flex: 1; min-height: 0; }
	canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; outline: none; }
	canvas.dragging { cursor: grabbing; }
	#bar {
		display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
		padding: 6px 8px; border-top: 1px solid var(--border); background: var(--panel);
	}
	.group { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
	.group > span { color: var(--muted); margin-right: 2px; }
	button {
		font: inherit; color: var(--text); background: var(--input); border: 1px solid var(--border);
		border-radius: 5px; padding: 3px 8px; cursor: pointer; touch-action: none; user-select: none;
	}
	button:hover { border-color: var(--accent); }
	button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
	button.zoom { width: 30px; padding: 3px 0; font-weight: 700; }
	/* Fullscreen button (like the template's web builds): top right, faint, hidden while the mouse doesn't move. */
	#fullscreen {
		position: absolute; top: 8px; right: 8px; z-index: 1;
		width: 34px; height: 34px; padding: 6px; border-radius: 6px;
		background: var(--panel); color: var(--text); opacity: 0.45; transition: opacity 0.3s;
	}
	#fullscreen:hover, #fullscreen:focus-visible { opacity: 0.95; }
	#fullscreen.idle:not(:hover):not(:focus-visible) { opacity: 0; pointer-events: none; }
	#fullscreen svg { display: block; width: 100%; height: 100%; }
	#fullscreen .exit, :fullscreen #fullscreen .enter { display: none; }
	:fullscreen #fullscreen .exit { display: block; }
</style>
</head>
<body>
<div id="app">
	<div id="view">
		<canvas id="canvas" tabindex="0" role="img"
			aria-label="Zoomable number line with a lane for int, unsigned int, float and double, showing every value each type can store"></canvas>
		<button id="fullscreen" type="button" title="Fullscreen (F11)" aria-label="Toggle fullscreen" hidden>
			<svg class="enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
				<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>
			</svg>
			<svg class="exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
				<path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/>
			</svg>
		</button>
	</div>
	<div id="bar">
		<div class="group">
			<button class="zoom" id="zoomOut" title="Zoom out (hold, or press -)" aria-label="Zoom out">−</button>
			<button class="zoom" id="zoomIn" title="Zoom in (hold, or press +)" aria-label="Zoom in">+</button>
		</div>
		<div class="group" id="presets">
			<span>Go to:</span>
		</div>
		<div class="group" id="ranges">
			<span>Range of:</span>
		</div>
	</div>
</div>
<script>
'use strict';

// ---- Number types --------------------------------------------------------------------------------------------
const pow2 = (k) => Math.pow(2, k); // exact for -1074 <= k <= 1023
const TYPES = [
	{ name: 'int', bits: 32, kind: 'int', lo: -2147483648, hi: 2147483647, color: '--int' },
	{ name: 'unsigned int', bits: 32, kind: 'int', lo: 0, hi: 4294967295, color: '--uint' },
	{ name: 'float', bits: 32, kind: 'float', mant: 23, minE: -126, maxE: 127, sig: 9, color: '--float' },
	{ name: 'double', bits: 64, kind: 'float', mant: 52, minE: -1022, maxE: 1023, sig: 17, color: '--double' },
];
for (const t of TYPES) {
	if (t.kind === 'float') { t.hi = (2 - pow2(-t.mant)) * pow2(t.maxE); t.lo = -t.hi; }
}

// The binary exponent of a positive double (x in [2^e, 2^(e+1))); -1023 for subnormal numbers.
const dv = new DataView(new ArrayBuffer(8));
function expOf(x) {
	dv.setFloat64(0, x);
	const e = (dv.getUint16(0) >> 4) & 0x7ff;
	return e === 0 ? -1023 : e - 1023;
}
const ulpDouble = (x) => { const a = Math.abs(x); return a < pow2(-1022) ? pow2(-1074) : pow2(expOf(a) - 52); };

// The distance between two neighbouring values of type t around x, or null when x is out of range.
function stepAt(t, x) {
	if (x < t.lo || x > t.hi) return null;
	if (t.kind === 'int') return 1;
	const a = Math.abs(x);
	if (a < pow2(t.minE)) return pow2(t.minE - t.mant);
	return pow2(expOf(a) - t.mant);
}

// Pieces of [L, R] in which the values of type t are evenly spaced: [from, to, step].
function segments(t, L, R) {
	const out = [];
	const a = Math.max(L, t.lo), b = Math.min(R, t.hi);
	if (a > b) return out;
	if (t.kind === 'int') { out.push([a, b, 1]); return out; }
	const positive = (A, B, sign) => { // 0 <= A <= B
		const sub = pow2(t.minE);
		const push = (p, q, s) => out.push(sign > 0 ? [p, q, s] : [-q, -p, s]);
		if (A < sub) push(A, Math.min(B, sub), pow2(t.minE - t.mant));
		for (let e = A < sub ? t.minE : expOf(A); e <= t.maxE; e++) {
			const p = pow2(e);
			if (p > B) break;
			const q = e === t.maxE ? t.hi : pow2(e + 1);
			push(Math.max(A, p), Math.min(B, q), pow2(e - t.mant));
		}
	};
	if (b > 0) positive(Math.max(a, 0), b, 1);
	if (a < 0) positive(Math.max(-b, 0), -a, -1);
	return out;
}

// ---- Formatting ----------------------------------------------------------------------------------------------
const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
const sup = (n) => String(n).split('').map((c) => SUP[c]).join('');
const trimZeros = (s) => (s.includes('.') ? s.replace(/0+$/, '').replace(/\.$/, '') : s);
function commas(s) {
	const neg = s.startsWith('-'), body = neg ? s.slice(1) : s;
	const [i, f] = body.split('.');
	return (neg ? '−' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (f !== undefined ? '.' + f : '');
}
function expForm(v, digits) {
	const [m, e] = v.toExponential(Math.max(0, Math.min(16, digits))).split('e');
	return `${trimZeros(m).replace('-', '−')} × 10${sup(Number(e))}`;
}
// A number with (at most) sig significant digits.
function fmtNum(v, sig) {
	if (v === 0) return '0';
	if (!Number.isFinite(v)) return v > 0 ? '∞' : '−∞';
	const a = Math.abs(v);
	if (a >= 1e-5 && a < 1e16) {
		const s = v.toPrecision(sig);
		if (!s.includes('e')) return commas(trimZeros(s));
	}
	return expForm(v, sig - 1);
}
// The values on the ruler: as many decimals as the step between them needs.
function rulerFormat(step, mag) {
	const p = Math.floor(Math.log10(step) + 1e-9);
	if (mag < 1e15 && p >= -8) {
		const decimals = Math.max(0, -p);
		return (v) => (Math.abs(v) < step / 2 ? '0' : commas(v.toFixed(decimals)));
	}
	const sig = Math.max(1, Math.min(17, Math.floor(Math.log10(Math.max(mag, step))) - p + 1));
	return (v) => (Math.abs(v) < step / 2 ? '0' : expForm(v, sig - 1));
}
function fmtStep(s) {
	if (s === 1) return '1';
	const k = Math.round(Math.log2(s));
	if (k > 0 && k <= 53) return `2${sup(k)} = ${commas(String(s))}`;
	return `2${sup(k)} ≈ ${fmtNum(s, 3)}`;
}

// ---- View state ------------------------------------------------------------------------------------------------
const MAX = Number.MAX_VALUE;
// The view: the value in the middle, and the zoom as log2 of the units per (CSS) pixel. Near 0 the units per pixel get
// smaller than the smallest double (2^-1074), so the zoom is kept as a power of two, and distances are converted to
// pixels in two steps (see toPx and fromPx), so that every intermediate result is a normal double.
let centre = 5, zl = Math.log2(12 / 800);
let W = 800, H = 400, DPR = 1;
// The whole numbers from a to b (at most max of them). Counted with an index: above 2^53, k + 1 can be equal to k.
function range(a, b, max = 4000) {
	const out = [];
	for (let i = 0; i <= b - a && i <= max; i++) out.push(a + i);
	return out;
}
const snap = (x) => (Math.round(x * DPR) + 0.5) / DPR; // crisp 1-pixel lines
const clampView = () => {
	if (Number.isNaN(centre)) centre = 0; // (±Infinity, from panning past the largest double, is clamped to ±MAX below)
	centre = Math.max(-MAX, Math.min(MAX, centre));
	if (!Number.isFinite(zl)) zl = 0;
	// at most 256 px between two doubles; zooming in stops at 64 px (see zoomAt): the margin lets you pan past a power of
	// two (where the distance between doubles doubles) without changing the zoom
	zl = Math.max(Math.log2(ulpDouble(centre)) - 8, Math.min(zl, Math.log2(MAX / (W * 0.4))));
};
// Deep zoom (near 0): scale by 2^1074 first, in two steps of 2^537 (2^1074 itself is too large for a double).
const BIG = pow2(537), SMALL = pow2(-537), deep = () => zl < -900;
const toPx = (d) => (deep() ? d * BIG * BIG * pow2(-zl - 1074) : d * pow2(-zl)); // a distance in units, in pixels
const fromPx = (p) => (deep() ? p * pow2(zl + 1074) * SMALL * SMALL : p * pow2(zl)); // a distance in pixels, in units
// The distance from b to a, in pixels. a - b is exact for nearby values, so it's precise at any zoom. Only when it
// overflows (MAX - -MAX, when the whole double range is in view) are both values scaled first.
const pxBetween = (a, b) => { const d = a - b; return Number.isFinite(d) ? toPx(d) : toPx(a) - toPx(b); };
// shift: the part of a drag that is smaller than the distance between two doubles, in pixels. At the deepest zoom, two
// neighbouring doubles are 64 px apart, and centre (a double) can only move in such steps: shift keeps the rest.
let shift = 0;
const xOf = (v) => W / 2 + shift + pxBetween(v, centre);
const valueAt = (x) => centre + fromPx(x - W / 2 - shift);
const clampShift = () => { shift = Number.isFinite(shift) ? Math.max(-W / 2, Math.min(W / 2, shift)) : 0; };
// Move the number line dx pixels to the right: whole steps go into centre, the rest into shift.
function pan(dx) {
	const s = shift + dx, c0 = centre, z0 = zl;
	centre = c0 - fromPx(s); clampView();
	shift = zl === z0 ? s - pxBetween(c0, centre) : 0;
	clampShift(); requestDraw();
}
const edge = (x) => Math.max(-MAX, Math.min(MAX, valueAt(x))); // a value at the edge of the view (always a finite double)

// ---- Theme (follows the embedding page) -------------------------------------------------------------------------
let colors = {};
function currentTheme() {
	try {
		const t = window.parent !== window && window.parent.document.documentElement.dataset.theme;
		if (t === 'light' || t === 'dark') return t;
	} catch {}
	return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme() {
	document.documentElement.dataset.theme = currentTheme();
	const cs = getComputedStyle(document.documentElement);
	for (const k of ['--bg', '--panel', '--text', '--muted', '--grid', '--accent', '--border', '--int', '--uint', '--float', '--double'])
		colors[k] = cs.getPropertyValue(k).trim();
	requestDraw();
}
try {
	if (window.parent !== window) new MutationObserver(applyTheme).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
} catch {}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

// ---- Drawing ---------------------------------------------------------------------------------------------------
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const FONT = 'system-ui, -apple-system, "Segoe UI", sans-serif';
const MONO = 'menlo, consolas, "DejaVu Sans Mono", monospace';
let pending = false;
function requestDraw() { if (!pending) { pending = true; requestAnimationFrame(draw); } }

function resize() {
	const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
	W = Math.max(1, r.width); H = Math.max(1, r.height); DPR = dpr;
	canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
	ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
	requestDraw();
}
new ResizeObserver(resize).observe(canvas);

function drawRuler(top, height) {
	const L = edge(0), R = edge(W), mag = Math.max(Math.abs(L), Math.abs(R));
	ctx.font = `11px ${MONO}`;
	let step = 0, fmt = null;
	const raw = Math.max(fromPx(90), 1e-323), e10 = Math.floor(Math.log10(raw));
	const nice = [];
	// m × 10^e from a string: Math.pow(10, -323) is 0, but Number('1e-323') is not
	for (let i = 0; i < 4; i++) for (const m of [1, 2, 5]) nice.push([Number(`${m}e${e10 + i}`), m]);
	let mult = 1;
	for (const [s, m] of nice) {
		if (s < raw || !Number.isFinite(s)) continue;
		const f = rulerFormat(s, mag);
		const wLabel = Math.max(ctx.measureText(f(L)).width, ctx.measureText(f(R)).width);
		step = s; fmt = f; mult = m;
		if (toPx(s) >= wLabel + 24) break;
	}
	const base = top + height - 1;
	ctx.strokeStyle = colors['--border']; ctx.lineWidth = 1;
	ctx.beginPath(); ctx.moveTo(0, base + 0.5); ctx.lineTo(W, base + 0.5); ctx.stroke();
	// minor ticks
	const minor = step / (mult === 2 ? 4 : 5);
	if (toPx(minor) >= 6) {
		ctx.strokeStyle = colors['--muted']; ctx.globalAlpha = 0.5; ctx.beginPath();
		for (const k of range(Math.ceil(L / minor), Math.floor(R / minor))) {
			const x = snap(xOf(k * minor));
			ctx.moveTo(x, base); ctx.lineTo(x, base - 4);
		}
		ctx.stroke(); ctx.globalAlpha = 1;
	}
	// major ticks with labels, and a grid line through the lanes
	ctx.fillStyle = colors['--muted']; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
	const gridLines = [];
	for (const k of range(Math.ceil(L / step), Math.floor(R / step))) {
		const v = k * step, x = snap(xOf(v));
		if (!Number.isFinite(v)) continue;
		ctx.strokeStyle = colors['--muted'];
		ctx.beginPath(); ctx.moveTo(x, base); ctx.lineTo(x, base - 8); ctx.stroke();
		ctx.fillText(fmt(v), x, base - 12);
		gridLines.push(x);
	}
	return gridLines;
}

function drawLane(t, top, height) {
	const color = colors[t.color];
	const L = edge(0), R = edge(W);
	const baseY = Math.round(top + height * 0.6) + 0.5, tickH = Math.min(20, height * 0.3);

	// title: the type, and how far apart its values are under the cursor (or in the middle of the view)
	const s = stepAt(t, hoverX === null ? centre : valueAt(hoverX));
	ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
	ctx.font = `600 13px ${FONT}`; ctx.fillStyle = color;
	const title = `${t.name}`;
	ctx.fillText(title, 10, top + 17);
	let x0 = 10 + ctx.measureText(title).width + 8;
	ctx.font = `12px ${FONT}`; ctx.fillStyle = colors['--muted'];
	const detail = `${t.bits} bits` + (s === null ? '' : ` · values are ${fmtStep(s)} apart here`); // out of range: the lane itself says so
	ctx.fillText(detail, x0, top + 17);

	// the part of the line where this type has no values
	const inL = Math.max(L, t.lo), inR = Math.min(R, t.hi);
	ctx.strokeStyle = colors['--muted']; ctx.globalAlpha = 0.6; ctx.setLineDash([3, 4]);
	const outParts = [];
	if (inL > inR) outParts.push([0, W]);
	else {
		if (L < t.lo) outParts.push([0, xOf(t.lo)]);
		if (R > t.hi) outParts.push([xOf(t.hi), W]);
	}
	for (const [a, b] of outParts) {
		ctx.beginPath(); ctx.moveTo(Math.max(0, a), baseY); ctx.lineTo(Math.min(W, b), baseY); ctx.stroke();
	}
	ctx.setLineDash([]); ctx.globalAlpha = 1;
	ctx.font = `11px ${FONT}`; ctx.fillStyle = colors['--muted']; ctx.textAlign = 'center';
	for (const [a, b] of outParts) {
		const p = Math.max(0, a), q = Math.min(W, b);
		const hovered = hoverX !== null && hoverX >= p && hoverX <= q; // then the cursor says it
		if (q - p > 80 && !hovered) ctx.fillText('out of range', (p + q) / 2, baseY - 7);
	}

	// the values: a tick for each value, or a solid band where they are too close together
	ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1 / DPR * Math.max(1, Math.round(DPR));
	ctx.font = `11px ${MONO}`; ctx.textAlign = 'center';
	const bands = []; // [x from, x to] of the dense parts, merged so that they are drawn once
	const labels = []; // [x, text] of the values to label, placed after all segments, without overlaps
	for (const [a, b, step] of segments(t, L, R)) {
		const px = toPx(step);
		if (px < 3.5) {
			const xa = Math.max(0, xOf(a)), xb = Math.min(W, xOf(b));
			const last = bands[bands.length - 1];
			if (last && xa <= last[1] + 1 && xb >= last[0] - 1) { last[0] = Math.min(last[0], xa); last[1] = Math.max(last[1], xb); }
			else bands.push([xa, xb]);
			continue;
		}
		const k0 = Math.ceil(a / step), k1 = Math.floor(b / step);
		if (k1 - k0 > 5000) continue;
		const label = (v) => (t.kind === 'int' ? commas(String(v)) : fmtNum(v, t.sig));
		// label every n-th value, counted from the value nearest to the middle of the view
		const kc = Math.min(k1, Math.max(k0, Math.round(centre / step)));
		const wLabel = ctx.measureText(label(kc * step)).width;
		const every = Math.ceil((wLabel + 14) / px);
		ctx.beginPath();
		for (const k of range(k0, k1)) {
			const x = snap(xOf(k * step));
			ctx.moveTo(x, baseY); ctx.lineTo(x, baseY - tickH);
		}
		ctx.stroke();
		if (every <= 4) {
			for (const k of range(k0, k1)) if ((((k - kc) % every) + every) % every === 0) labels.push([Math.round(xOf(k * step)), label(k * step)]);
		}
	}
	labels.sort((p, q) => p[0] - q[0]);
	let right = -Infinity;
	for (const [x, text] of labels) {
		const w = ctx.measureText(text).width;
		if (x - w / 2 < right + 10) continue;
		ctx.fillText(text, x, baseY + 15);
		right = x + w / 2;
	}
	bands.sort((p, q) => p[0] - q[0]);
	const merged = [];
	for (const band of bands) {
		const last = merged[merged.length - 1];
		if (last && band[0] <= last[1] + 1) last[1] = Math.max(last[1], band[1]);
		else merged.push([...band]);
	}
	ctx.globalAlpha = 0.45;
	for (const [xa, xb] of merged) ctx.fillRect(xa, baseY - tickH, Math.max(1, xb - xa), tickH);
	ctx.globalAlpha = 0.5; ctx.strokeStyle = color;
	ctx.beginPath(); ctx.moveTo(Math.max(0, xOf(inL)), baseY); ctx.lineTo(Math.min(W, xOf(inR)), baseY);
	if (inL <= inR) ctx.stroke();
	ctx.globalAlpha = 1;
	return baseY;
}

// The value that type t stores for v: the nearest value it can represent (null when v is out of range).
function nearest(t, v) {
	if (t.kind === 'int') return v < t.lo - 0.5 || v > t.hi + 0.5 ? null : Math.min(t.hi, Math.max(t.lo, Math.round(v)));
	if (t.bits === 32) { const f = Math.fround(v); return Number.isFinite(f) ? f : null; }
	return Number.isFinite(v) ? v : null;
}
// A label with a background, next to the cursor line (on the right side, or on the left near the right edge).
function pill(text, x, y, color, font) {
	ctx.font = font;
	const w = ctx.measureText(text).width + 10, h = 17;
	const left = x + 6 + w > W ? x - 6 - w : x + 6;
	ctx.fillStyle = colors['--panel']; ctx.strokeStyle = color; ctx.lineWidth = 1;
	ctx.beginPath(); ctx.roundRect(Math.round(left) + 0.5, Math.round(y - h / 2) + 0.5, Math.round(w), h, 4); ctx.fill(); ctx.stroke();
	ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
	ctx.fillText(text, left + 5, y + 0.5);
	ctx.textBaseline = 'alphabetic';
}
// The cursor: a line through all lanes, the value under the cursor, and the value that each type stores for it.
function drawCursor(x, rulerH, baselines) {
	const v = valueAt(x);
	ctx.strokeStyle = colors['--text']; ctx.globalAlpha = 0.55; ctx.lineWidth = 1;
	ctx.beginPath(); ctx.moveTo(snap(x), rulerH - 6); ctx.lineTo(snap(x), H - 22); ctx.stroke();
	ctx.globalAlpha = 1;
	const sig = v === 0 ? 3 : Math.max(3, Math.min(17, Math.floor(Math.log10(Math.abs(v))) - Math.floor(Math.log10(Math.max(fromPx(4), 5e-324))) + 1));
	pill(fmtNum(v, sig), x, 13, colors['--text'], `11px ${MONO}`);
	TYPES.forEach((t, i) => {
		const color = colors[t.color], y = baselines[i];
		const n = nearest(t, v);
		if (n === null) { pill('out of range', x, y - 12, color, `600 11px ${MONO}`); return; }
		const nx = xOf(n);
		if (nx >= 0 && nx <= W) { // the value that is stored
			ctx.fillStyle = color; ctx.strokeStyle = colors['--bg']; ctx.lineWidth = 2;
			ctx.beginPath(); ctx.arc(nx, y, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
		}
		pill(t.kind === 'int' ? commas(String(n)) : fmtNum(n, t.sig), x, y - 12, color, `600 11px ${MONO}`); // above the line, like "out of range"
	});
}

function draw() {
	pending = false;
	ctx.fillStyle = colors['--bg']; ctx.fillRect(0, 0, W, H);
	const rulerH = 34;
	const laneH = (H - rulerH - 22) / TYPES.length;
	const grid = drawRuler(0, rulerH);
	ctx.strokeStyle = colors['--grid']; ctx.lineWidth = 1; ctx.beginPath();
	for (const x of grid) { ctx.moveTo(x, rulerH); ctx.lineTo(x, H - 22); }
	ctx.stroke();
	const baselines = TYPES.map((t, i) => drawLane(t, rulerH + i * laneH, laneH));
	if (hoverX !== null) drawCursor(hoverX, rulerH, baselines);
	ctx.font = `11.5px ${FONT}`; ctx.fillStyle = colors['--muted']; ctx.textAlign = 'left';
	ctx.fillText(W < 520 ? 'Pinch or scroll to zoom, drag to move' : 'Scroll or pinch to zoom, drag to move, and point at the number line to see the values that are stored.', 10, H - 7);
}

// ---- Interaction -----------------------------------------------------------------------------------------------
let anim = null;
function stopAnim() { anim = null; }
// Zoom around the point x: everything moves towards (or away from) x.
function zoomAt(x, factor) {
	// v: the double nearest to x. At the deepest zoom it can be up to 32 px away from x: keep that offset (scaled),
	// instead of moving v to x, so that the number line doesn't jump.
	const v = valueAt(x), xv = xOf(v), z0 = zl;
	zl += Math.log2(factor);
	if (factor < 1) zl = Math.max(zl, Math.min(z0, Math.log2(ulpDouble(v)) - 6)); // zooming in stops at 64 px between doubles
	clampView();
	const target = x + (xv - x) * pow2(z0 - zl); // where v goes: the zoom scales its distance to x
	centre = v - fromPx(target - W / 2); clampView();
	shift = target - W / 2 - pxBetween(v, centre); clampShift();
	requestDraw();
}
canvas.addEventListener('wheel', (e) => {
	e.preventDefault(); stopAnim();
	const dy = e.deltaY * (e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? 400 : 1);
	const r = canvas.getBoundingClientRect();
	zoomAt(e.clientX - r.left, Math.pow(2, dy * 0.003));
}, { passive: false });

const pointers = new Map();
let pinchDist = 0;
canvas.addEventListener('pointerdown', (e) => {
	stopAnim(); canvas.setPointerCapture(e.pointerId);
	pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
	if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchDist = Math.hypot(a.x - b.x, a.y - b.y); }
	canvas.classList.add('dragging');
});
let hoverX = null; // where the cursor is, in CSS pixels (null when it is not over the number line)
canvas.addEventListener('pointermove', (e) => {
	const r = canvas.getBoundingClientRect();
	if (e.pointerType === 'mouse' || pointers.size === 1) { hoverX = e.clientX - r.left; requestDraw(); }
	const p = pointers.get(e.pointerId);
	if (!p) return;
	if (pointers.size === 1) {
		pan(e.clientX - p.x);
	} else if (pointers.size === 2) {
		p.x = e.clientX; p.y = e.clientY;
		const [a, b] = [...pointers.values()];
		const d = Math.hypot(a.x - b.x, a.y - b.y);
		if (pinchDist > 0 && d > 0) zoomAt((a.x + b.x) / 2 - r.left, pinchDist / d);
		pinchDist = d;
		return;
	}
	p.x = e.clientX; p.y = e.clientY;
});
const release = (e) => {
	pointers.delete(e.pointerId); pinchDist = 0;
	if (pointers.size === 0) canvas.classList.remove('dragging');
};
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('pointerleave', () => { hoverX = null; requestDraw(); });
canvas.addEventListener('dblclick', (e) => { const r = canvas.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.shiftKey ? 4 : 0.25); });
canvas.addEventListener('keydown', (e) => {
	if (e.key === '+' || e.key === '=') zoomAt(W / 2, 0.5);
	else if (e.key === '-' || e.key === '_') zoomAt(W / 2, 2);
	else if (e.key === 'ArrowLeft') pan(W * 0.1);
	else if (e.key === 'ArrowRight') pan(-W * 0.1);
	else return;
	stopAnim(); e.preventDefault();
});

// Hold a zoom button to keep zooming (the "infinite zoom").
function holdZoom(button, dir) {
	let held = false, last = 0, start = 0;
	const tick = (now) => {
		if (!held) return;
		const dt = Math.min(0.1, (now - last) / 1000); last = now;
		const rate = Math.min(60, 2 + ((now - start) / 1000) * 6); // doublings per second: faster the longer you hold
		zoomAt(W / 2, Math.pow(2, dir * dt * rate));
		requestAnimationFrame(tick);
	};
	button.addEventListener('pointerdown', (e) => {
		e.preventDefault(); stopAnim(); held = true; last = start = performance.now();
		zoomAt(W / 2, Math.pow(2, dir * 0.25));
		requestAnimationFrame(tick);
	});
	for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) button.addEventListener(ev, () => { held = false; });
	button.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); zoomAt(W / 2, dir > 0 ? 2 : 0.5); } });
}
holdZoom(document.getElementById('zoomIn'), -1);
holdZoom(document.getElementById('zoomOut'), 1);

// Fly to a place on the number line: zoom out, move, zoom in.
function flyTo(c1, u1) {
	const c0 = centre, l0 = zl;
	const l1 = Math.log2(u1);
	const need = Math.log2(Math.max(Math.abs(c1 - c0), 1e-300) / (W * 0.5));
	const bump = Math.max(0, need - (l0 + l1) / 2);
	const t0 = performance.now(), dur = 1600;
	const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
	const me = {};
	anim = me;
	const step = (now) => {
		if (anim !== me) return;
		const t = Math.min(1, (now - t0) / dur);
		const e = smooth(0, 1, t);
		zl = l0 + (l1 - l0) * e + bump * 4 * e * (1 - e);
		centre = c0 + (c1 - c0) * smooth(0.2, 0.8, t); shift = 0;
		if (t >= 1) { centre = c1; zl = l1; anim = null; }
		clampView(); requestDraw();
		if (anim === me) requestAnimationFrame(step);
	};
	requestAnimationFrame(step);
}
// [label, centre, units per pixel]: computed when the button is clicked, because they depend on the width of the view
const PLACES = [
	['0 … 10', () => [5, 12 / W]],
	['0.1', () => [0.1, pow2(-27) * 7 / W]],
	['2²⁴', () => [16777216, 24 / W]],
	['1 day in ms', () => [86400000, 160 / W]],
	['10²⁰', () => [1e20, pow2(43) * 14 / W]],
	['near 0', () => [0, pow2(-149) * 30 / W]],
];
const whole = (t) => () => [t.lo / 2 + t.hi / 2, (t.hi / 2 - t.lo / 2) / (W * 0.45)]; // the whole range, with a margin
const RANGES = TYPES.map((t) => [t.name, whole(t)]);
function addButtons(box, list) {
	for (const [label, view] of list) {
		const b = document.createElement('button');
		b.textContent = label;
		b.addEventListener('click', () => flyTo(...view()));
		box.appendChild(b);
	}
}
addButtons(document.getElementById('presets'), PLACES);
addButtons(document.getElementById('ranges'), RANGES);

// Fullscreen: the button, or F11 (only when the browser allows fullscreen, e.g. not in an iframe without allowfullscreen).
(function () {
	const button = document.getElementById('fullscreen');
	if (!document.fullscreenEnabled) return;
	button.hidden = false;
	const toggle = () => {
		if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
		else document.documentElement.requestFullscreen().catch(() => {});
	};
	button.addEventListener('click', () => { toggle(); button.blur(); canvas.focus(); });
	document.addEventListener('keydown', (e) => { if (e.key === 'F11') { e.preventDefault(); toggle(); } });
	// Hide the button when the mouse hasn't moved for a few seconds.
	let timer = 0;
	const show = () => {
		button.classList.remove('idle');
		clearTimeout(timer);
		timer = setTimeout(() => button.classList.add('idle'), 2500);
	};
	window.addEventListener('pointermove', show);
	window.addEventListener('pointerdown', show);
	show();
})();

applyTheme();
resize();
</script>
</body>

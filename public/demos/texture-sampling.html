<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Texture Sampling</title>
<style>
	:root {
		--bg: #0f1218;
		--panel: #171b24;
		--border: #2c3342;
		--text: #d6dae3;
		--muted: #8b93a5;
		--accent: #7aa2f7;
		--input: #1c2130;
		--grid: rgba(255, 255, 255, 0.08);
		--hot: #ffd866;
		color-scheme: dark;
	}
	:root[data-theme='light'] {
		--bg: #f7f8fa;
		--panel: #ffffff;
		--border: #d5d9e2;
		--text: #23262e;
		--muted: #5d6474;
		--accent: #2f5bd3;
		--input: #eef0f5;
		--grid: rgba(0, 0, 0, 0.08);
		--hot: #d4380d;
		color-scheme: light;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
	#app { display: flex; flex-direction: column; height: 100%; }
	#view { position: relative; flex: 1; min-height: 0; }
	canvas { display: block; width: 100%; height: 100%; touch-action: none; }
	#bar { display: flex; align-items: flex-start; gap: 10px 14px; padding: 6px 10px; border-top: 1px solid var(--border); background: var(--panel); }
	.group { display: flex; flex-direction: column; gap: 4px; flex: none; }
	.row { display: flex; gap: 4px; }
	button {
		font: inherit; color: var(--text); background: var(--input); border: 1px solid var(--border);
		border-radius: 5px; padding: 2px 7px; cursor: pointer; user-select: none;
	}
	button:hover { border-color: var(--accent); }
	button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
	button[aria-pressed='true'] { border-color: var(--accent); color: var(--accent); }
	label { display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
	input[type='range'] { width: 110px; accent-color: var(--accent); }
	/* Always four lines high, so the drawing doesn't change size. Lines wrap between pieces, never inside one. */
	#info { flex: 1; min-width: 0; min-height: 6em; font: 12.5px/1.5 ui-monospace, Consolas, 'Cascadia Mono', monospace; }
	#info > div { display: flex; flex-wrap: wrap; column-gap: 2.2ch; align-items: center; }
	#info > div > span { white-space: pre; }
	.m { color: var(--muted); } .hot { color: var(--hot); }
	/* A small signature at the right end of the bar: this demo was made with Claude. */
	.made-by { align-self: flex-end; flex: none; width: 18px; height: 18px; opacity: 0.35; transition: opacity 0.3s; }
	.made-by:hover { opacity: 0.9; }
</style>
</head>
<body>
<div id="app">
	<div id="view">
		<canvas id="canvas" role="img"
			aria-label="On the left, a grid of screen pixels with a textured quad of two triangles whose corners can be dragged. On the right, the 8 by 8 texel texture in texture coordinates from -1 to 2, repeated by the address mode, with the quad's texture coordinates drawn over it. Hovering a pixel shows its texture coordinate and the texel it picks."></canvas>
	</div>
	<div id="bar">
		<div class="group">
			<div class="row" role="group" aria-label="Address mode">
				<button type="button" data-mode="Wrap" aria-pressed="true">Wrap</button>
				<button type="button" data-mode="Mirror" aria-pressed="false">Mirror</button>
				<button type="button" data-mode="Clamp" aria-pressed="false">Clamp</button>
			</div>
			<label>uv range <input id="scale" type="range" min="0.5" max="3" step="0.25" value="1.5" /> <span id="scaleText"></span></label>
		</div>
		<div id="info" aria-live="polite"></div>
		<img class="made-by" src="/images/claude-logo.svg" alt="Made with Claude" title="Made with Claude" />
	</div>
</div>
<script>
'use strict';
// The texture: 8 x 8 texels. An arrow that points right, a red texel at the top-left corner and a
// green one at the bottom-right corner, so every flip of the texture is easy to see.
const Art = [
	'r.......',
	'....y...',
	'....yy..',
	'yyyyyyy.',
	'yyyyyyy.',
	'....yy..',
	'....y...',
	'.......g',
];
const Palette = { '.': [92, 168, 220], y: [250, 204, 60], r: [230, 60, 60], g: [70, 190, 90] };
const TexSize = 8;
const texel = (x, y) => Palette[Art[y][x]];

// The screen: a grid of pixels, with a quad of two triangles on it.
const ScreenW = 30, ScreenH = 20;
const corners = [
	{ x: 4.3, y: 3.2 }, // top-left
	{ x: 25.6, y: 2.1 }, // top-right
	{ x: 26.4, y: 17.2 }, // bottom-right
	{ x: 3.1, y: 16.4 }, // bottom-left
];
let mode = 'Wrap';
let uvRange = 1.5; // The texture coordinates go from 0.5 - uvRange / 2 to 0.5 + uvRange / 2.
let hover = null; // The pixel under the mouse.

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const info = document.getElementById('info');
let W = 1, H = 1, DPR = 1;
let px = 1, sx = 0, sy = 0; // Screen panel: pixel size and origin.
let tx = 1, ux = 0, uy = 0; // Texture panel: size of one texel, and the origin of u = v = 0.

// ---- Sampling, exactly like Sampler.cpp ----
const modulo = (a, b) => ((a % b) + b) % b;
function applyAddressMode(i, size) {
	if (mode === 'Wrap') return modulo(i, size);
	if (mode === 'Mirror') { const m = modulo(i, 2 * size); return m < size ? m : 2 * size - 1 - m; }
	return Math.min(size - 1, Math.max(0, i));
}

// ---- Rasterizing the quad, like FillTriangle: pixel centers, the top-left rule ----
const edge = (a, b, q) => (b.x - a.x) * (q.y - a.y) - (b.y - a.y) * (q.x - a.x);
const cornerUV = () => {
	const lo = 0.5 - uvRange / 2, hi = 0.5 + uvRange / 2;
	return [{ u: lo, v: lo }, { u: hi, v: lo }, { u: hi, v: hi }, { u: lo, v: hi }];
};
// The texture coordinate of the pixel (x, y), or null when the quad doesn't cover it.
function texCoordAt(x, y) {
	const uv = cornerUV();
	const p = { x: x + 0.5, y: y + 0.5 };
	for (const t of [[0, 1, 2], [0, 2, 3]]) {
		let [a, b, c] = t;
		let area = edge(corners[a], corners[b], corners[c]);
		if (area === 0) continue;
		if (area < 0) { [b, c] = [c, b]; area = -area; } // Make it clockwise on the screen.
		const v = [corners[a], corners[b], corners[c]];
		const e = [edge(v[1], v[2], p), edge(v[2], v[0], p), edge(v[0], v[1], p)];
		const topLeft = (from, to) => (to.y === from.y && to.x > from.x) || to.y < from.y;
		const inside = e.every((w, i) => w > 0 || (w === 0 && topLeft(v[(i + 1) % 3], v[(i + 2) % 3])));
		if (!inside) continue;
		const l = e.map((w) => w / area);
		const ids = [a, b, c];
		return {
			u: l[0] * uv[ids[0]].u + l[1] * uv[ids[1]].u + l[2] * uv[ids[2]].u,
			v: l[0] * uv[ids[0]].v + l[1] * uv[ids[1]].v + l[2] * uv[ids[2]].v,
		};
	}
	return null;
}
function sample(t) {
	const i = Math.floor(t.u * TexSize), j = Math.floor(t.v * TexSize);
	const x = applyAddressMode(i, TexSize), y = applyAddressMode(j, TexSize);
	return { i, j, x, y, color: texel(x, y) };
}

// ---- Theme (follows the embedding page) ----
let colors = {};
function currentTheme() {
	try {
		const t = window.parent !== window && window.parent.document.documentElement.dataset.theme;
		if (t === 'light' || t === 'dark') return t;
	} catch {}
	return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme() {
	document.documentElement.dataset.theme = currentTheme();
	const cs = getComputedStyle(document.documentElement);
	for (const k of ['--bg', '--text', '--muted', '--grid', '--hot', '--border']) colors[k] = cs.getPropertyValue(k).trim();
	draw();
}
try {
	if (window.parent !== window) new MutationObserver(applyTheme).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
} catch {}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

function resize() {
	const r = canvas.getBoundingClientRect();
	W = Math.max(1, r.width); H = Math.max(1, r.height); DPR = window.devicePixelRatio || 1;
	canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
	// Two panels side by side: the screen (ScreenW x ScreenH pixels) and the texture (3 x 3 copies of 8 x 8 texels).
	const gap = 28, pad = 12, top = 22;
	const unitsW = ScreenW + 3 * TexSize; // Both panels in "cells".
	const cell = Math.max(1, Math.min((W - 2 * pad - gap) / unitsW, (H - top - pad) / Math.max(ScreenH, 3 * TexSize)));
	px = tx = cell;
	const total = unitsW * cell + gap;
	sx = (W - total) / 2; sy = top + (H - top - pad - ScreenH * cell) / 2;
	ux = sx + ScreenW * cell + gap + TexSize * cell; uy = top + (H - top - pad - 3 * TexSize * cell) / 2 + TexSize * cell;
	draw();
}
new ResizeObserver(resize).observe(canvas);
const rgb = (c, a = 1) => `rgba(${c.join(', ')}, ${a})`;

function draw() {
	if (!colors['--bg']) return;
	ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
	ctx.fillStyle = colors['--bg'];
	ctx.fillRect(0, 0, W, H);
	ctx.font = '600 12px system-ui, sans-serif';
	ctx.textBaseline = 'bottom';
	ctx.fillStyle = colors['--muted'];
	ctx.textAlign = 'left';
	ctx.fillText('screen pixels', sx, sy - 4);
	ctx.fillText('texture, u and v from -1 to 2', ux - TexSize * tx, uy - TexSize * tx - 4);

	// The screen: every pixel that the quad covers gets the texel at its texture coordinate.
	const hits = [];
	for (let y = 0; y < ScreenH; ++y)
		for (let x = 0; x < ScreenW; ++x) {
			const t = texCoordAt(x, y);
			if (!t) continue;
			const s = sample(t);
			ctx.fillStyle = rgb(s.color);
			ctx.fillRect(sx + x * px, sy + y * px, px, px);
			hits.push(t);
		}
	ctx.strokeStyle = colors['--grid'];
	ctx.lineWidth = 1;
	ctx.beginPath();
	for (let x = 0; x <= ScreenW; ++x) { ctx.moveTo(sx + x * px, sy); ctx.lineTo(sx + x * px, sy + ScreenH * px); }
	for (let y = 0; y <= ScreenH; ++y) { ctx.moveTo(sx, sy + y * px); ctx.lineTo(sx + ScreenW * px, sy + y * px); }
	ctx.stroke();

	// The quad's outline, its diagonal and its corners.
	const S = (p) => [sx + p.x * px, sy + p.y * px];
	ctx.strokeStyle = colors['--text'];
	ctx.lineWidth = 1.5;
	ctx.beginPath();
	corners.forEach((c, i) => (i ? ctx.lineTo(...S(c)) : ctx.moveTo(...S(c))));
	ctx.closePath();
	ctx.moveTo(...S(corners[0])); ctx.lineTo(...S(corners[2]));
	ctx.stroke();
	corners.forEach((c) => {
		ctx.fillStyle = colors['--bg'];
		ctx.beginPath(); ctx.arc(...S(c), 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
	});

	// The texture: u and v from -1 to 2, each texel with the color that the address mode gives it.
	// The copies outside 0 to 1 are dimmed.
	for (let j = -TexSize; j < 2 * TexSize; ++j)
		for (let i = -TexSize; i < 2 * TexSize; ++i) {
			const c = texel(applyAddressMode(i, TexSize), applyAddressMode(j, TexSize));
			ctx.fillStyle = rgb(c);
			ctx.fillRect(ux + i * tx, uy + j * tx, tx, tx);
			if (i < 0 || j < 0 || i >= TexSize || j >= TexSize) {
				ctx.globalAlpha = 0.55;
				ctx.fillStyle = colors['--bg'];
				ctx.fillRect(ux + i * tx, uy + j * tx, tx, tx);
				ctx.globalAlpha = 1;
			}
		}
	ctx.strokeStyle = colors['--text'];
	ctx.lineWidth = 2;
	ctx.strokeRect(ux, uy, TexSize * tx, TexSize * tx);
	// The corners of the texture, labeled on a dark box so they stay readable on any texel.
	ctx.font = '12px ui-monospace, Consolas, monospace';
	ctx.textBaseline = 'middle';
	const label = (text, x, y, align) => {
		const w = ctx.measureText(text).width + 6;
		const left = align === 'left' ? x : x - w;
		ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
		ctx.fillRect(left, y - 8, w, 16);
		ctx.fillStyle = '#fff';
		ctx.textAlign = 'left';
		ctx.fillText(text, left + 3, y);
	};
	label('(0, 0)', ux, uy - 10, 'left');
	label('(1, 1)', ux + TexSize * tx, uy + TexSize * tx + 10, 'right');

	// The quad in texture coordinates, and the texture coordinates of the covered pixel centers.
	const U = (t) => [ux + t.u * TexSize * tx, uy + t.v * TexSize * tx];
	const uv = cornerUV();
	ctx.strokeStyle = colors['--text'];
	ctx.setLineDash([5, 4]);
	ctx.lineWidth = 1.5;
	ctx.beginPath();
	uv.forEach((t, i) => (i ? ctx.lineTo(...U(t)) : ctx.moveTo(...U(t))));
	ctx.closePath();
	ctx.stroke();
	ctx.setLineDash([]);
	ctx.fillStyle = rgb([0, 0, 0], 0.45);
	for (const t of hits) {
		const [x, y] = U(t);
		ctx.fillRect(x - 1, y - 1, 2, 2);
	}

	// The pixel under the mouse, its texture coordinate, and the texel it picks.
	let h = null;
	if (hover) {
		const t = texCoordAt(hover.x, hover.y);
		ctx.strokeStyle = colors['--hot'];
		ctx.lineWidth = 2.5;
		ctx.strokeRect(sx + hover.x * px, sy + hover.y * px, px, px);
		if (t) {
			const s = sample(t);
			h = { t, s };
			// The texel the coordinate falls in, before the address mode...
			ctx.strokeRect(ux + s.i * tx, uy + s.j * tx, tx, tx);
			// ...and the texel of the texture that the address mode turns it into.
			if (s.i !== s.x || s.j !== s.y) {
				ctx.setLineDash([3, 3]);
				ctx.strokeRect(ux + s.x * tx, uy + s.y * tx, tx, tx);
				ctx.beginPath();
				ctx.moveTo(ux + (s.i + 0.5) * tx, uy + (s.j + 0.5) * tx);
				ctx.lineTo(ux + (s.x + 0.5) * tx, uy + (s.y + 0.5) * tx);
				ctx.stroke();
				ctx.setLineDash([]);
			}
			const [x, y] = U(t);
			ctx.fillStyle = colors['--hot'];
			ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
		}
	}
	showInfo(h);
}

const line = (...pieces) => `<div>${pieces.map((x) => `<span>${x}</span>`).join('')}</div>`;
const f = (v) => (v < 0 ? '' : ' ') + v.toFixed(3);
function showInfo(h) {
	// Always four short lines, so the bar never changes height.
	const modeText = {
		Wrap: 'Wrap: index mod 8',
		Mirror: 'Mirror: i = index mod 16, then 15 − i if i ≥ 8',
		Clamp: 'Clamp: index clamped to 0..7',
	}[mode];
	if (!h) {
		info.innerHTML = line(hover ? `<span class="m">pixel (${hover.x}, ${hover.y}) is outside the quad</span>`
			: '<span class="m">hover over a pixel to see its texel</span>')
			+ line('<span class="m">drag the corners to change the quad</span>')
			+ line('<span class="m">texel index = floor(u · 8), floor(v · 8)</span>')
			+ line(`<span class="m">${modeText}</span>`);
		return;
	}
	const { t, s } = h;
	info.innerHTML =
		line(`<span class="hot">pixel (${hover.x}, ${hover.y})</span>`, `uv at its center = (${f(t.u)}, ${f(t.v)})`)
		+ line(`floor(u · 8) = ${s.i}`, `floor(v · 8) = ${s.j}`)
		+ line(`${mode}: (${s.i}, ${s.j}) → texel (${s.x}, ${s.y})`,
			`<span class="m">${s.i === s.x && s.j === s.y ? 'inside the texture' : 'outside the texture'}</span>`)
		+ line(`<span class="m">${modeText}</span>`);
}

// ---- Controls ----
const modeButtons = [...document.querySelectorAll('[data-mode]')];
modeButtons.forEach((b) => b.addEventListener('click', () => {
	mode = b.dataset.mode;
	modeButtons.forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
	draw();
}));
const scaleInput = document.getElementById('scale');
const scaleText = document.getElementById('scaleText');
function updateScale() {
	uvRange = Number(scaleInput.value);
	const lo = 0.5 - uvRange / 2, hi = 0.5 + uvRange / 2;
	scaleText.textContent = `${lo.toFixed(2)} to ${hi.toFixed(2)}`;
	draw();
}
scaleInput.addEventListener('input', updateScale);

// ---- Dragging the corners, hovering the pixels ----
let drag = null;
function screenAt(e) {
	const rc = canvas.getBoundingClientRect();
	return { x: (e.clientX - rc.left - sx) / px, y: (e.clientY - rc.top - sy) / px };
}
const cornerAt = (q) => {
	const i = corners.findIndex((c) => Math.hypot(c.x - q.x, c.y - q.y) < Math.max(0.7, 8 / px));
	return i >= 0 ? i : null;
};
canvas.addEventListener('pointerdown', (e) => {
	drag = cornerAt(screenAt(e));
	if (drag === null) return;
	canvas.setPointerCapture(e.pointerId);
	canvas.style.cursor = 'grabbing';
});
canvas.addEventListener('pointermove', (e) => {
	const q = screenAt(e);
	if (drag !== null) {
		corners[drag] = { x: Math.min(ScreenW, Math.max(0, q.x)), y: Math.min(ScreenH, Math.max(0, q.y)) };
	} else {
		canvas.style.cursor = cornerAt(q) !== null ? 'grab' : 'default';
	}
	const x = Math.floor(q.x), y = Math.floor(q.y);
	hover = drag === null && x >= 0 && y >= 0 && x < ScreenW && y < ScreenH ? { x, y } : null;
	draw();
});
canvas.addEventListener('pointerleave', () => { if (drag === null) { hover = null; draw(); } });
const endDrag = () => { drag = null; canvas.style.cursor = 'default'; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

applyTheme();
updateScale();
resize();
</script>
</body>
</html>

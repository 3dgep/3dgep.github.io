<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2D Software Rasterizer</title>
  <style>
    /* The example fills the whole browser window: the canvas is sized here, and SDL follows that size.
       Window::Present scales the surface to fit, with black bars where the shape doesn't match. */
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #ccc; font: 14px system-ui, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }

    /* Fullscreen button: top right, faint, and hidden while the mouse doesn't move. */
    #fullscreen {
      position: fixed; top: 12px; right: 12px; z-index: 1;
      width: 36px; height: 36px; padding: 6px; border: 0; border-radius: 6px;
      background: rgba(0, 0, 0, 0.35); color: #fff; cursor: pointer;
      opacity: 0.35; transition: opacity 0.3s;
    }
    #fullscreen:hover, #fullscreen:focus-visible { opacity: 0.9; }
    #fullscreen.idle:not(:hover) { opacity: 0; pointer-events: none; }
    #fullscreen svg { display: block; width: 100%; height: 100%; }
    #fullscreen .exit, :fullscreen #fullscreen .enter { display: none; }
    :fullscreen #fullscreen .exit { display: block; }
  </style>
</head>
<body>
  <!-- The example draws to this canvas. Click it to give it the keyboard focus. -->
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">Loading…</div>
  <button id="fullscreen" type="button" tabindex="-1" title="Fullscreen (F11)" aria-label="Toggle fullscreen" hidden>
    <svg class="enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>
    </svg>
    <svg class="exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/>
    </svg>
  </button>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus: function (text) { document.getElementById('status').textContent = text; },
      print: function (text) { console.log(text); },    // std::cout goes to the browser console (F12)
      printErr: function (text) { console.error(text); },
    };

    // The fullscreen button (only when the browser supports fullscreen; F11 works too).
    (function () {
      var button = document.getElementById('fullscreen');
      if (!document.fullscreenEnabled) return;
      button.hidden = false;
      button.addEventListener('click', function () {
        if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
        else document.documentElement.requestFullscreen().catch(function () {});
        button.blur();                                    // keys go to the example again,
        document.getElementById('canvas').focus();        // not to the button
      });
      // Hide the button when the mouse hasn't moved for a few seconds.
      var timer = 0;
      function show() {
        button.classList.remove('idle');
        clearTimeout(timer);
        timer = setTimeout(function () { button.classList.add('idle'); }, 2500);
      }
      window.addEventListener('pointermove', show);
      window.addEventListener('pointerdown', show);
      show();
    })();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
